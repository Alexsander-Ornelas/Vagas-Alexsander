# Botão "Atualizar" do site: abre uma issue "Atualizar busca de vagas"; este workflow dispara a busca programada no Claude
# (endpoint /fire da tarefa) e fecha a issue. Só reage a issues abertas pelo dono do repositório.
# Segredo necessário: ROUTINE_TOKEN (chave da API da tarefa, gerada em claude.ai/code/routines).
name: Atualizar busca de vagas
on:
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  issues: write
jobs:
  disparar:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Atualizar busca'))
    runs-on: ubuntu-latest
    steps:
      - name: Disparar a busca no Claude
        id: fire
        env:
          ROUTINE_TOKEN: ${{ secrets.ROUTINE_TOKEN }}
        run: |
          if [ -z "$ROUTINE_TOKEN" ]; then echo "msg=Falta o segredo ROUTINE_TOKEN no repositório." >> "$GITHUB_OUTPUT"; exit 1; fi
          code=$(curl -s -o resp.json -w '%{http_code}' -X POST \
            https://api.anthropic.com/v1/claude_code/routines/trig_01GjF9UFntU8tjpX7iBF7dpX/fire \
            -H "Authorization: Bearer $ROUTINE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d '{"text": "Rodada manual pedida pelo botão Atualizar do site."}')
          echo "HTTP $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "msg=Busca iniciada às $(TZ=America/Sao_Paulo date '+%d/%m %H:%M'). Em alguns minutos o site é atualizado." >> "$GITHUB_OUTPUT"
          else
            echo "msg=A busca não iniciou (HTTP $code). Confira o segredo ROUTINE_TOKEN ou use Run now em claude.ai/code/routines." >> "$GITHUB_OUTPUT"; exit 1
          fi
      - name: Responder e fechar a issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.fire.outputs.msg }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "${MSG:-Falha ao disparar a busca.}"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
